# stephens.croquetwade.com: the Stephens demo site (m13-bettr) at the root,
# plus the practice copy at /try-editing/. Other hosts use the default site.
server {
    listen       3000;
    listen  [::]:3000;
    server_name  stephens.croquetwade.com;
    root   /usr/share/nginx/html/stephens/m13-bettr;
    index  index.html;
    location /try-editing/ { root /usr/share/nginx/html; }
    location / { try_files $uri $uri/ =404; }
}
